[package]
name = "zerotrace"
version = "0.1.1"
description = "ZeroTrace — 100% local, zero-telemetry network & privacy monitor for Windows."
authors = ["ZeroTrace contributors"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.97.1"

[lib]
name = "zerotrace"
path = "src/lib.rs"

[[bin]]
name = "zerotrace"
path = "src/main.rs"

[workspace]
members = ["elevated"]

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_NetworkManagement_WindowsFirewall",
  "Win32_Networking_WinSock",
  "Win32_Security_Cryptography",
  "Win32_Security_WinTrust",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_IO",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Pipes",
  "Win32_System_Restore",
  "Win32_System_Services",
  "Win32_System_SystemInformation",
  "Win32_System_TaskScheduler",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Shell",
] }
winreg = "0.55"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
