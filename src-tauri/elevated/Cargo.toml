[package]
name = "zerotrace-elevated"
version = "0.1.2"
description = "ZeroTrace elevated helper — performs one scoped privileged action per invocation, then exits."
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.97.1"

[dependencies]
zerotrace = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Pipes",
] }
